name: publish

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: read

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Check whether this exact version is already published
        id: ver
        run: |
          local_version="$(node -p "require('./package.json').version")"
          echo "local=${local_version}"
          if npm view "stop-ai-slop@${local_version}" version >/dev/null 2>&1; then
            echo "version already in registry, skipping publish"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "version not in registry yet"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to npm via OIDC
        if: steps.ver.outputs.skip == 'false'
        run: npm publish --provenance
