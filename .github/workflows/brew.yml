name: brew

on:
  push:
    branches: [main]
    paths:
      - "Formula/**"
      - ".github/workflows/brew.yml"
  pull_request:
    paths:
      - "Formula/**"
      - ".github/workflows/brew.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  brew:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install the formula from the repo
        run: brew install --formula ./Formula/stop-ai-slop.rb
      - name: Run the formula test block
        run: brew test stop-ai-slop
      - name: Smoke
        run: stop-ai-slop --help | head -1
