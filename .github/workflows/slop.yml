name: slop

on:
  push:
    branches: [main]
  pull_request:

jobs:
  self-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: node skill/scripts/scan.mjs --self-test

  install-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          node skill/scripts/scan.mjs --install && test -x .git/hooks/pre-commit && echo exec-bit-ok

  dogfood-pr:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          base: ${{ github.base_ref }}
