name: stop-ai-slop-gate
description: Comment-slop gate for pull requests — fails on slop comments in lines added versus a base ref

inputs:
  base:
    description: Base ref to diff added lines against
    required: false
    default: ""
  strict:
    description: "true to fail on warnings too"
    required: false
    default: "false"
  format:
    description: Output format — text, json (rdjson) or sarif
    required: false
    default: "text"
  annotations:
    description: "true to emit ::error/::warning workflow commands (text format only)"
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Require a resolvable base ref
      shell: bash
      run: |
        if [ -z "$BASE_REF" ]; then
          echo "::error::no base ref: on push events there is no github.base_ref; pass the base input explicitly or use pull_request"
          exit 1
        fi
      env:
        BASE_REF: "${{ inputs.base != '' && inputs.base || github.base_ref }}"
    - name: Fetch base ref
      shell: bash
      run: git fetch --no-tags --depth=1 origin "$BASE_REF"
      env:
        BASE_REF: "${{ inputs.base != '' && inputs.base || github.base_ref }}"
    - name: Scan added lines
      shell: bash
      run: |
        args=(--diff FETCH_HEAD)
        if [ "$STRICT" = "true" ]; then args+=(--strict); fi
        args+=(--format "$FORMAT")
        if [ "$ANNOTATIONS" = "true" ] && [ "$FORMAT" = "text" ]; then args+=(--annotations); fi
        node "$GITHUB_ACTION_PATH/skill/scripts/scan.mjs" "${args[@]}"
      env:
        STRICT: "${{ inputs.strict }}"
        FORMAT: "${{ inputs.format }}"
        ANNOTATIONS: "${{ inputs.annotations }}"

branding:
  icon: alert-octagon
  color: red
