    <script type="module" crossorigin>(function(){let e=document.createElement(`link`).relList;if(e&&e.supports&&e.supports(`modulepreload`))return;for(let e of document.querySelectorAll(`link[rel="modulepreload"]`))n(e);new MutationObserver(e=>{for(let t of e)if(t.type===`childList`)for(let e of t.addedNodes)e.tagName===`LINK`&&e.rel===`modulepreload`&&n(e)}).observe(document,{childList:!0,subtree:!0});function t(e){let t={};return e.integrity&&(t.integrity=e.integrity),e.referrerPolicy&&(t.referrerPolicy=e.referrerPolicy),t.credentials=e.crossOrigin===`use-credentials`?`include`:e.crossOrigin===`anonymous`?`omit`:`same-origin`,t}function n(e){if(e.ep)return;e.ep=!0;let n=t(e);fetch(e.href,n)}})();var e=[{id:`multi-line-comment`,severity:`error`,message:`комментарий занимает 2+ строки подряд`,why:`Многострочный комментарий — почти всегда пересказ кода или диффа. Через год его никто не перечитает, а рассинхрон с кодом не заметит никто.`,instead:`сжать до одной строки WHY: инвариант/ограничение оставить, пересказ прежнего поведения удалить (он живёт в коммите), причину теста — в имя теста или тикет, контрактную документацию — в doc-блок`,write:`// сбрасываем здесь, т.к. ниже освобождаем слот`,ignoreWhen:"doc-блок (JSDoc/docstring/`///` doc-комментарии) с контрактной документацией; короткий 2-строчный why с why-маркером (because/since/чтобы/…); легаси — через baseline",en:{message:`a comment spans 2+ consecutive lines (doc-blocks and /// doc-comment runs exempt)`,why:`A multi-line comment is almost always a retelling of the code or the diff. Nobody rereads it a year later, and nobody notices when it drifts from the code.`,instead:`compress to one line of WHY: keep the invariant/constraint, delete the retelling of the previous behavior (it lives in the commit), a test's provenance goes into the test name or a ticket, contract documentation into a doc-block`,write:`// reset here because the slot is freed below`,ignoreWhen:"doc-block (JSDoc/docstring/`///` doc comments) with contract documentation; a short 2-line why carrying a why-marker (because/since/…); legacy — via baseline"}},{id:`changelog-marker`,severity:`error`,message:`комментарий пересказывает дифф (пара changelog-маркеров или сильный маркер, ru/en/de/fr/es)`,why:`История изменений живёт в гите. «Было/стало» в коде устаревает в момент коммита и дальше только врёт. Одиночное «вместо/было» — обычная проза; сигнал чейнджлога — пара маркеров в одном блоке комментария или сильный маркер (this fixes, must take over, was…, now…, before this change, the old … kept, we used to; ru: «до этого изменения», «старое правило держало»).`,instead:`убрать комментарий; «почему» — в сообщение коммита`,write:`ничего в коде — причину пишем в сообщение коммита`,ignoreWhen:`дословная цитата внешней спеки, где формулировка зафиксирована`,en:{message:`the comment retells the diff (a pair of changelog markers or a strong marker, ru/en/de/fr/es)`,why:`Change history lives in git. «was/became» in code goes stale the moment you commit and only lies afterwards. A lone «instead of/was» is ordinary prose; the changelog signal is a pair of markers in one comment run or a strong marker (this fixes, must take over, was…, now…, before this change, the old … kept, we used to; RU «до этого изменения», «старое правило держало»).`,instead:`remove the comment; the «why» belongs in the commit message`,write:`nothing in code — the reason goes into the commit message`,ignoreWhen:`a verbatim quote from an external spec where the wording is fixed`}},{id:`long-comment`,severity:`error`,message:`строка комментария длиннее 120 символов`,why:`Длинная строка — признак простыни. Ограничение, достойное комментария, формулируется коротко.`,instead:`сжать мысль до одной короткой строки или удалить`,write:`// сбрасываем здесь, т.к. ниже освобождаем слот`,ignoreWhen:`doc-блок; строка с длинной ссылкой на спеку/issue`,en:{message:`a comment line longer than 120 characters`,why:`A long line is the smell of a wall of text. A constraint worth a comment can be stated briefly.`,instead:`compress the idea into one short line or delete it`,write:`// reset here because the slot is freed below`,ignoreWhen:`doc-block; a line whose length is dominated by a long spec/issue link`}},{id:`vend/step-numbered`,severity:`warning`,message:`нумерованный шаг в комментарии (Step N / Шаг N / N., маркер любого языка)`,why:`Нумерация дублирует порядок строк кода. После первой правки шаги вставляются между — номера врут.`,instead:`говорящие имена функций и переменных вместо номеров; комментарий удалить`,write:`const normalized = normalize(payload)`,ignoreWhen:`протокол из внешнего документа с фиксированной нумерацией шагов`,en:{message:`a numbered step in a comment (Step N / Шаг N / N., any language marker)`,why:`Numbering duplicates the order of the code lines. After the first edit steps get inserted in between — the numbers lie.`,instead:`speaking names of functions and variables instead of numbers; delete the comment`,write:`const normalized = normalize(payload)`,ignoreWhen:`a protocol from an external document with fixed step numbering`}},{id:`vend/section-divider`,severity:`warning`,message:`строка-разделитель из символов -=#*`,why:`Баннеры — признак файла-простыни. Навигацию даёт структура кода, а не линейки.`,instead:`разбить файл или убрать разделитель`,write:`ничего — навигацию даёт структура модулей`,ignoreWhen:`сгенерированный файл`,en:{message:`a divider line made of -=#* characters`,why:`Banners are the smell of a wall-of-text file. Navigation comes from code structure, not rulers.`,instead:`split the file or remove the divider`,write:`nothing — module structure is the navigation`,ignoreWhen:`a generated file`}},{id:`vend/markdown-in-comment`,severity:`warning`,message:`markdown-разметка внутри комментария (**, -, |)`,why:`Markdown в комментарии — документация, которую никто не читает рядом с кодом; она устаревает.`,instead:`убрать; документация — в README, why — в одну строку`,write:`// сбрасываем здесь, т.к. ниже освобождаем слот`,ignoreWhen:"docstring, который реально рендерится генератором доков; одиночный `|flag|` в прозе — строка таблицы требует минимум трёх пайпов",en:{message:`markdown syntax inside a comment (**, -, |)`,why:`Markdown in a comment is documentation nobody reads next to the code; it goes stale.`,instead:`remove it; documentation belongs in README, the why — in one line`,write:`// reset here because the slot is freed below`,ignoreWhen:"a docstring that is actually rendered by a docs generator; a lone `|flag|` in prose — a table row needs at least three pipes"}},{id:`vend/this-function-opener`,severity:`warning`,message:`комментарий начинается с «This function/…», «Эта функция/…», «Diese Funktion…», «Cette fonction…» или «Esta función…»`,why:`«This function does X» пересказывает сигнатуру. Ценность только в неочевидном ограничении.`,instead:`удалить или переформулировать как инвариант/воркэраунд`,write:`// дедупликация по id, т.к. источник шлёт повторы`,ignoreWhen:`публичный API с обязательным JSDoc по внешнему требованию`,en:{message:`a comment starts with "This function/…", «Эта функция/…», «Diese Funktion…», «Cette fonction…» or «Esta función…»`,why:`"This function does X" retells the signature. The only value is a non-obvious constraint.`,instead:`delete or rephrase as an invariant/workaround`,write:`// dedupe by id because the source sends duplicates`,ignoreWhen:`a public API where JSDoc is mandatory by external requirement`}},{id:`vend/file-summary-header`,severity:`warning`,message:`шапка-резюме из 2+ строк комментария в начале файла`,why:`Оглавление файла устаревает при первой же правке. Структуру видно по символам файла.`,instead:`убрать шапку; имя файла и структура говорят сами`,write:`ничего — файл начинается с кода`,ignoreWhen:`лицензионная шапка, требуемая политикой репо`,en:{message:`a 2+ line summary-header comment at the top of a file`,why:`A file table of contents goes stale at the first edit. The structure is visible through the file's symbols.`,instead:`remove the header; the file name and structure speak for themselves`,write:`nothing — the file starts with code`,ignoreWhen:`a license header required by repo policy`}},{id:`vend/generic-todo`,severity:`warning`,message:`TODO/FIXME/XXX без ссылки на тикет`,why:`TODO без тикета — вечный долг: некому искать и некогда чинить.`,instead:`добавить тикет: // TODO ABC-123 ... — или удалить`,write:`// TODO KRY-482 снять воркэраунд после фикса upstream`,ignoreWhen:`локальный черновик до первого коммита`,en:{message:`a TODO/FIXME/XXX without a ticket link (any case)`,why:`A TODO without a ticket is an eternal debt: nobody owns finding it and there is never time to fix it.`,instead:`add a ticket: // TODO ABC-123 ... — or delete it`,write:`// TODO KRY-482 drop the workaround after the upstream fix`,ignoreWhen:`a local draft before the first commit`}},{id:`vend/ticket-ref`,severity:`warning`,message:`тикет-ссылка в комментарии без TODO — контекст правки живёт в коммите/PR, не в коде`,why:`Тикет-ссылка без контекста ротирует вместе с трекером (Jira→GitHub миграции) и протекает чейнджлог в код. Правило неактивно, пока в конфиге не задан ticketPattern.`,instead:`вынести в коммит/PR или оформить как TODO с тикетом`,write:`// TODO KRY-482: снять воркэраунд после апстрима`,ignoreWhen:`комментарий документирует сам тикет (трекер-агенты, migration notes)`,en:{message:`a bare ticket reference in a comment — the change context belongs in the commit message or PR, not the code`,why:`A bare ticket reference rotates with the tracker (Jira→GitHub migrations) and leaks the changelog into the code. The rule is inert until ticketPattern is set in the config.`,instead:`move it to the commit/PR or shape it as a TODO with the ticket`,write:`// TODO KRY-482: drop the workaround after the upstream fix`,ignoreWhen:`the comment documents the ticket itself (tracker agents, migration notes)`}},{id:`vend/cross-file-ref`,severity:`warning`,message:`указатель на другой файл/строку в комментарии (handler.py:147)`,why:`Указатель на строку чужого файла гниёт при первой же правке там: номер перестаёт совпадать, и ни один инструмент этого не заметит. URL и host:port не флагаются.`,instead:`импортировать символ и сослаться на него — резолвится компилятором; либо назвать причину, а не место`,write:`// формат фиксирован вендором, см. спеку из тикета`,ignoreWhen:`URL с якорем #L12, host:port; требуется разделитель пути или известное кодовое расширение`,en:{message:`a pointer to another file/line in a comment (handler.py:147)`,why:`A pointer to a line of someone else's file rots at the first edit there: the number stops matching and no tool notices. URLs with #L12 anchors and host:port pairs are not flagged.`,instead:`import the symbol and reference it — the compiler resolves it; or name the reason, not the place`,write:`// the format is fixed by the vendor, see the spec linked from the ticket`,ignoreWhen:`URLs with #L12 anchors, host:port; a path separator or a known code extension is required`}},{id:`vend/obvious-comment`,severity:`warning`,message:`комментарий пересказывает строку кода под ним`,why:`Пересказ строки под ним не добавляет информации: код сам себя описывает, а пересказ рассинхронизируется при первом же рефакторинге. Комментарий с «почему» (т.к., чтобы, иначе, must, должен…) не флагается.`,instead:`удалить; неочевидное ограничение — отдельной строкой с «почему»`,write:`// сбрасываем здесь, т.к. ниже освобождаем слот`,ignoreWhen:`комментарий содержит обоснование; только кодовые профили, не проза`,en:{message:`a single-line comment restates the code line beneath it`,why:`A restatement of the line below adds no information: the code describes itself, and the restatement desyncs at the first refactor. A comment with a why (because, so that, must, only, intentionally…) is not flagged.`,instead:`delete it; a non-obvious constraint — as a separate line with the why`,write:`// reset here because the slot is freed below`,ignoreWhen:`the comment carries a rationale; code profiles only, not prose`}},{id:`vend/ai-plan-narration`,severity:`warning`,message:`комментарий пересказывает рабочий процесс агента (ссылки на план/спеку/задачу, подтверждение инструкций)`,why:`Ссылки на план, ТЗ или промпт и подтверждения «как было запрошено» — метаданные сессии, а не свойство кода: после закрытия задачи референт исчезает, и комментарий превращается в шум. Источник требования — тикет или имя теста.`,instead:`убрать; неочевидное требование — тикетом в TODO или одной строкой WHY`,write:`// таймаут 30 с, т.к. вендор не отвечает быстрее`,ignoreWhen:`дословная цитата внешней спеки, где формулировка зафиксирована`,en:{message:`a comment narrates the agent's own work process (plan/spec/task references, instruction acknowledgements)`,why:`References to the plan, the spec or the prompt and «as requested» acknowledgements are session metadata, not a property of the code: once the task closes the referent is gone and the comment turns into noise. The source of a requirement is a ticket or the test name.`,instead:`remove it; a non-obvious requirement — as a TODO ticket or one line of WHY`,write:`// 30s timeout because the vendor never answers faster`,ignoreWhen:`a verbatim quote from an external spec where the wording is fixed`}},{id:`vend/ai-vocab-density`,severity:`warning`,message:`3+ разных слов из ИИ-канона (delve, pivotal, tapestry...) в комментариях файла`,why:`Плотность канонных ИИ-слов — статистическая сигнатура генерации (Juzek & Ward 2025): где есть одно слово, там обычно есть и другие. Одиночное слово бывает и у человека; три разных в комментариях одного файла — уже сигнатура.`,instead:`заменить канонные слова на простые`,write:`обычная человеческая лексика`,ignoreWhen:`дословная цитата из внешнего текста, где формулировка зафиксирована`,en:{message:`3+ distinct AI-vocabulary words (delve, pivotal, tapestry...) in the file's comments`,why:`The density of canonical AI words is a statistical signature of generation (Juzek & Ward 2025): where there is one word, there are likely others. A single word occurs in human writing too; three distinct ones in one file's comments is already a signature.`,instead:`replace the canonical words with plain ones`,write:`ordinary human wording`,ignoreWhen:`a verbatim quote from an external text where the wording is fixed`}},{id:`vend/research-citation`,severity:`warning`,message:`научная ссылка в комментарии — код не место для библиографии`,why:`Цитата вида (Cormen et al., 2009) или arXiv-id документирует процесс написания кода, а не его свойство: при смене источников ссылка гниёт, и рассинхрона никто не замечает. Коду нужен инвариант, а не библиография.`,instead:`вынести ссылку в сообщение коммита, PR или README`,write:`инвариант своими словами: // высота дерева <= 2·log(n+1)`,ignoreWhen:`порт алгоритма с формулой из статьи, где ссылка дана в README`,en:{message:`a research citation in a comment — code is not a bibliography`,why:`A citation like (Cormen et al., 2009) or an arXiv id documents the writing process, not a property of the code: when sources change the reference rots and nobody notices the drift. Code needs the invariant, not the bibliography.`,instead:`move the citation to the commit message, the PR or the README`,write:`the invariant in your own words: // tree height <= 2·log(n+1)`,ignoreWhen:`an algorithm port whose formula comes from a paper cited in the README`}},{id:`vend/self-suppression`,severity:`warning`,message:`директива подавления без списка правил пришла вместе с подавляемым кодом`,why:`Директива в одной правке с кодом, который она глушит, — амнистия без ревизии: никто не проверил обоснование.`,instead:`указать явный список правил или внести директиву отдельной правкой`,write:`// stop-ai-slop-ignore-next-line vend/step-numbered -- нумерация из внешнего протокола`,ignoreWhen:`full-scan: директива уже в репо, подавление легитимно`,en:{message:`a suppression directive without a rule list arrived together with the code it sup
